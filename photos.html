<style>
  /* Justified rows: each photo's width is proportional to its aspect ratio (--r),
     so every row is the same height and no photo is cropped. */
  .gallery { display: flex; flex-wrap: wrap; gap: 12px; }
  .gallery::after { content: ""; flex-grow: 999999; } /* keeps the last row from stretching */
  .gallery figure { margin: 0; flex-grow: calc(var(--r) * 100); flex-basis: calc(var(--r) * 260px); }
  .gallery a { display: block; cursor: zoom-in; }
  .gallery img { display: block; width: 100%; aspect-ratio: var(--r); object-fit: cover; }
  .gallery figcaption { font-size: 0.8em; padding-top: 6px; opacity: 0.65; }
  @media (max-width: 543px) {
    .gallery figure { flex-basis: calc(var(--r) * 150px); }
  }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; z-index: 2000; display: none;
              align-items: center; justify-content: center; flex-direction: column;
              background: rgba(0, 0, 0, 0.92); }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 94vw; max-height: 86vh; display: block; }
  .lightbox p { color: #ddd; margin-top: 12px; font-size: 0.85em; }
  .lightbox button { position: absolute; background: rgba(255, 255, 255, 0.12); color: #fff;
                     border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 22px;
                     line-height: 44px; padding: 0; cursor: pointer; }
  .lightbox button:hover { background: rgba(255, 255, 255, 0.28); }
  .lightbox .lb-close { top: 16px; right: 16px; }
  .lightbox .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
</style>
</head>

<script>
  document.addEventListener("DOMContentLoaded", function (event) {
     navActivePage();
  });

  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll(".gallery a"));
    var box = document.getElementById("lightbox");
    var img = box.querySelector("img");
    var caption = box.querySelector("p");
    var current = -1;

    function show(i) {
      current = (i + links.length) % links.length;
      var link = links[current];
      img.src = link.href;
      img.alt = link.querySelector("img").alt;
      caption.textContent = link.parentNode.querySelector("figcaption").textContent;
      box.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function close() {
      box.classList.remove("open");
      img.removeAttribute("src");
      document.body.style.overflow = "";
      current = -1;
    }

    links.forEach(function (link, i) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        show(i);
      });
    });

    box.querySelector(".lb-close").addEventListener("click", close);
    box.querySelector(".lb-prev").addEventListener("click", function () { show(current - 1); });
    box.querySelector(".lb-next").addEventListener("click", function () { show(current + 1); });
    box.addEventListener("click", function (e) {
      if (e.target === box) close();
    });
    document.addEventListener("keydown", function (e) {
      if (current < 0) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") show(current - 1);
      else if (e.key === "ArrowRight") show(current + 1);
    });
  })();
</script>
